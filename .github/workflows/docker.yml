name: docker

# Integración: construye backend y frontend, valida el Caddyfile, levanta el compose con todo en
# fake y comprueba salud, aislamiento de red, puertos publicados y que el log no guarda cookies.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # semanal (lunes 06:00 UTC)

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integracion:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Clonar tutorIa-backend
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ github.repository_owner }}/tutorIa-backend
          path: backend

      - name: Clonar tutorIa-frontend
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ github.repository_owner }}/tutorIa-frontend
          path: frontend

      - name: Preparar .env (todo en fake)
        run: cp .env.example .env

      - name: Validar el Caddyfile
        run: |
          docker run --rm -e SITE_ADDRESS=:80 \
            -v "$PWD/frontend/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validar la sintaxis del compose
        run: docker compose config --quiet

      - name: Construir y levantar
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Estado de los servicios
        if: always()
        run: docker compose ps

      - name: Salud a través de Caddy
        run: |
          curl -fsS http://localhost:8080/api/v1/health/ready
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/una/ruta/de/la/spa

      - name: Cabeceras de seguridad y CSP
        run: |
          h="$(curl -fsSI http://localhost:8080/)"
          echo "$h"
          grep -qi '^content-security-policy:.*frame-src https://www.youtube-nocookie.com' <<<"$h"
          ! grep -qi '^server:' <<<"$h"

      - name: Sin cookie, una ruta privada responde 401
        run: |
          codigo="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/auth/me)"
          echo "código: $codigo"
          test "$codigo" = "401"

      - name: Aislamiento de red
        run: |
          if docker compose exec -T db wget -T 3 -qO- https://example.com >/dev/null 2>&1; then
            echo "ERROR: db tiene salida a internet"; exit 1
          fi
          docker compose exec -T backend python -c "import urllib.request as u;print(u.urlopen('https://example.com',timeout=5).status)"

      - name: Solo frontend publica puertos
        run: |
          for s in db backend; do
            id="$(docker compose ps -q "$s")"
            puertos="$(docker inspect -f '{{json .NetworkSettings.Ports}}' "$id")"
            echo "$s: $puertos"
            if grep -q 'HostPort' <<<"$puertos"; then echo "ERROR: $s publica puertos"; exit 1; fi
          done

      - name: El registro de acceso no guarda cookies
        run: |
          curl -s -o /dev/null -H 'Cookie: tutoria_sesion=VALOR-SECRETO-DE-PRUEBA' http://localhost:8080/api/v1/health
          sleep 1
          if docker compose logs frontend | grep -q 'VALOR-SECRETO-DE-PRUEBA'; then
            echo "ERROR: la cookie aparece en el log"; exit 1
          fi

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Limpiar
        if: always()
        run: docker compose down -v
